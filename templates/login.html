<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | JV Tips</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body style="background:var(--lab-black); min-height:100vh; display:flex; align-items:center; justify-content:center;">

<div class="lab-bg-grid"></div>
<div class="lab-bg-noise"></div>

<div class="lab-glass-card" style="max-width:400px; width:90%; position:relative; z-index:2;">
 <span class="corner tl"></span><span class="corner br"></span>
 <div class="lp-logo" style="margin-bottom:24px;"><span class="dot"></span>JV TIPS</div>
 <h2 style="font-family:var(--lab-font-display); text-transform:uppercase; font-size:24px; margin:0 0 20px;">Login</h2>

 {% if erro %}
 <p style="color: #ff4d4d; font-weight: bold; font-size:14px;">{{ erro }}</p>
 {% endif %}

 <form method="POST" action="/login">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <input type="email" name="email" placeholder="Email" required>
 <input type="password" name="senha" placeholder="Senha" required>
 <button type="submit" class="lab-btn lab-btn-primary" style="width:100%; justify-content:center; margin-top:10px;">Entrar</button>
 </form>
 <p style="margin-top:16px; font-size:13px; color:var(--lab-text-muted);">
  Acesso vencido? <a href="/#cadastro" style="color:var(--green);">Renovar assinatura</a>
 </p>
</div>

</body>
</html>
