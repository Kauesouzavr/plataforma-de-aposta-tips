<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel de Palpites</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>📋 Painel de Palpites</h2>

        {% if erro %}
            <p style="color: #ff4d4d; font-weight: bold;">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <input type="password" name="senha" placeholder="Senha do painel" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</div>

</body>
</html>
