<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Palpites</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="lab-bg-grid"></div>
<div class="lab-bg-noise"></div>
<div class="pk-topo">
 <div class="lp-logo"><span class="dot"></span>PAINEL DE PALPITES</div>
 <a href="/painel/logout" class="pk-sair">Sair</a>
</div>

<div class="pk-wrap" style="max-width: 700px;">

 <div class="pk-section-label">Novo palpite</div>

 <div class="lp-cadastro-box" style="max-width: none; margin-bottom: 50px;">
 <form method="POST">
 <input type="text" name="competicao" placeholder="Competição (ex: Brasileirão Série A)" maxlength="100" required>
 <input type="text" name="confronto" placeholder="Confronto (ex: Flamengo x Palmeiras)" maxlength="100" required>
 <input type="text" name="mercado" placeholder="Palpite (ex: Mais de 2.5 gols)" maxlength="100" required>
 <input type="text" name="odd" placeholder="Odd (ex: 1.85)" maxlength="10" required>
 <input type="url" name="link" placeholder="Link da casa de apostas (https://...)" maxlength="500" required>
 <label style="display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:14px; margin:12px 0;">
 <input type="checkbox" name="hot" style="width:auto; margin:0;">Marcar como destaque ( HOT)
 </label>
 <button type="submit">Publicar palpite</button>
 </form>
 </div>

 <div class="pk-section-label">Palpites publicados</div>

 {% if palpites %}
 <div class="pk-picks-grid">
 {% for p in palpites %}
 <div class="pk-pick-card">
 {% if p.hot %}<div class="pk-hot">HOT </div>{% endif %}
 <div class="pk-meta">{{ p.competicao }}</div>
 <div class="pk-teams">{{ p.confronto }}</div>
 <div class="pk-pick-row">
 <div>
 <div class="pk-market-lbl">Palpite</div>
 <div class="pk-market-val">{{ p.mercado }}</div>
 </div>
 <div class="pk-odd-box">
 <div class="lbl">Odd</div>
 <div class="val">{{ p.odd }}</div>
 </div>
 <form method="POST" action="/painel/excluir/{{ p.id }}" onsubmit="return confirm('Excluir este palpite?');">
 <button type="submit" style="background: var(--danger); width:auto; padding: 10px 16px; font-size:13px;">Excluir</button>
 </form>
 </div>
 </div>
 {% endfor %}
 </div>
 {% else %}
 <p style="color: var(--text-faint);">Nenhum palpite publicado ainda.</p>
 {% endif %}

</div>

</body>
</html>
